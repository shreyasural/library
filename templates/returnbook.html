{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Return Book</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background-image:url("{% static 'images/returnbook.jpg' %}");
            background-size:cover;
            background-position:center;
            background-repeat:no-repeat;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .container{
            width:420px;
            background:rgba(255,255,255,0.92);
            padding:35px;
            border-radius:15px;
            box-shadow:0 8px 20px rgba(0,0,0,0.35);
        }

        h2{
            text-align:center;
            color:#0d6efd;
            margin-bottom:30px;
        }

        label{
            display:block;
            font-size:17px;
            font-weight:bold;
            color:#333;
            margin-bottom:8px;
        }

        input[type="text"]{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:16px;
            margin-bottom:20px;
            outline:none;
        }

        input[type="text"]:focus{
            border-color:#0d6efd;
        }

        .return-btn{
            width:100%;
            padding:12px;
            background:#fd7e14;
            color:white;
            border:none;
            border-radius:8px;
            font-size:17px;
            cursor:pointer;
            transition:0.3s;
        }

        .return-btn:hover{
            background:#ca6510;
        }

        .back-btn{
            display:block;
            text-align:center;
            margin-top:18px;
            padding:12px;
            text-decoration:none;
            background:#6c757d;
            color:white;
            border-radius:8px;
            transition:0.3s;
        }

        .back-btn:hover{
            background:#495057;
        }
    </style>

</head>

<body>

<div class="container">

    <h2>📚 Return Book</h2>

    <form method="POST">
        {% csrf_token %}

        <label>Book ID</label>

        <input
            type="text"
            name="book_id"
            placeholder="Enter Book ID"
            required
        >

        <button type="submit" class="return-btn">
            Return Book
        </button>

    </form>

    <a href="{% url 'dashboard' %}" class="back-btn">
        ← Back to Dashboard
    </a>

</div>

</body>
</html>
