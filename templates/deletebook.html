{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Book</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background-image:url("{% static 'images/issuebook.jpg' %}");
            background-size:cover;
            background-position:center;
            background-repeat:no-repeat;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            width:420px;
            background:rgba(255,255,255,0.90);
            padding:35px;
            border-radius:15px;
            box-shadow:0 8px 20px rgba(0,0,0,0.35);
        }

        h2{
            text-align:center;
            color:#dc3545;
            margin-bottom:30px;
        }

        label{
            display:block;
            font-size:17px;
            font-weight:bold;
            color:#333;
            margin-bottom:8px;
        }

        input[type="text"]{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:16px;
            margin-bottom:20px;
        }

        .delete-btn{
            width:100%;
            padding:12px;
            border:none;
            border-radius:8px;
            background:#dc3545;
            color:white;
            font-size:17px;
            cursor:pointer;
            transition:0.3s;
        }

        .delete-btn:hover{
            background:#b02a37;
        }

        .back-btn{
            display:block;
            width:100%;
            text-align:center;
            text-decoration:none;
            margin-top:15px;
            padding:12px;
            border-radius:8px;
            background:#0d6efd;
            color:white;
            font-size:16px;
            transition:0.3s;
        }

        .back-btn:hover{
            background:#084298;
        }
    </style>

</head>

<body>

<div class="container">

    <h2>🗑 Delete Book</h2>

    <form method="POST">
        {% csrf_token %}

        <label>Book ID</label>
        <input type="text"
               name="book_id"
               placeholder="Enter Book ID"
               required>

        <button type="submit" class="delete-btn">
            Delete Book
        </button>
    </form>

    <a href="{% url 'dashboard' %}" class="back-btn">
        ← Back to Dashboard
    </a>

</div>

</body>
</html>
