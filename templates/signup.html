{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Sign Up</title>

<style>

body{
    background-image: url("{% static 'images/home2.jpg' %}");
    background-size: cover;
    background-repeat: no-repeat;
    background-position: center;
    font-family: Arial, sans-serif;
    margin: 0;
    height: 100vh;
}

/* Dark Overlay */
body::before{
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.45);
    z-index: -1;
}

.container{
    width: 400px;
    margin: 40px auto;
    background: rgba(255,255,255,0.92);
    padding: 35px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0px 10px 25px rgba(0,0,0,0.35);
}

h2{
    color: #198754;
    font-size: 32px;
    margin-bottom: 10px;
}

.subtitle{
    color: #666;
    font-size: 16px;
    margin-bottom: 25px;
}

input{
    width: 90%;
    padding: 12px;
    margin: 12px 0;
    border-radius: 10px;
    border: 1px solid #ccc;
    font-size: 16px;
    outline: none;
    transition: 0.3s;
}

input:focus{
    border-color: #198754;
    box-shadow: 0px 0px 8px rgba(25,135,84,0.3);
}

button{
    width: 95%;
    padding: 13px;
    background: linear-gradient(135deg,#198754,#0d6efd);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

button:hover{
    transform: translateY(-3px);
    box-shadow: 0px 8px 20px rgba(0,0,0,0.3);
}

a{
    text-decoration: none;
    color: #0d6efd;
    font-weight: bold;
}

a:hover{
    text-decoration: underline;
}

.message{
    background: #ffe5e5;
    color: #d8000c;
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 15px;
    font-weight: bold;
}

p{
    color: #444;
    font-size: 16px;
}

.footer{
    margin-top: 25px;
    color: #666;
    font-size: 14px;
}

</style>

</head>

<body>

<div class="container">

    <h2>📚 Create Account</h2>

    <p class="subtitle">
        Register to access the Smart Library Management System
    </p>

    {% if messages %}
        {% for message in messages %}
            <p class="message">{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <input
            type="text"
            name="username"
            placeholder="Username"
            required
        >

        <input
            type="email"
            name="email"
            placeholder="Email Address"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <input
            type="password"
            name="confirm_password"
            placeholder="Confirm Password"
            required
        >

        <button type="submit">
            Sign Up
        </button>

    </form>

    <br>

    <p>Already have an account?</p>

    <a href="/login/">Login</a>

    <div class="footer">
        Smart Library Management System
    </div>

</div>

</body>
</html>
