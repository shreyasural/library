{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Delete Account</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{

            background-image:
            url("{% static 'images/home2.jpg' %}");

            background-size:cover;
            background-position:center;

            min-height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;
        }

        .container{

            width:430px;

            background:rgba(255,255,255,0.95);

            padding:35px;

            border-radius:20px;

            text-align:center;

            box-shadow:0 10px 25px
            rgba(0,0,0,0.35);
        }

        .icon{

            font-size:60px;

            margin-bottom:15px;
        }

        h2{

            color:#dc3545;

            margin-bottom:15px;

            font-size:28px;
        }

        p{

            color:#555;

            line-height:1.6;

            margin-bottom:25px;
        }

        .warning{

            background:#fff3cd;

            color:#856404;

            border-left:5px solid #dc3545;

            padding:15px;

            border-radius:10px;

            margin-bottom:25px;

            font-weight:bold;
        }

        button{

            width:100%;

            padding:13px;

            background:#dc3545;

            color:white;

            border:none;

            border-radius:10px;

            font-size:17px;

            font-weight:bold;

            cursor:pointer;

            margin-bottom:15px;

            transition:0.3s;
        }

        button:hover{

            background:#b02a37;

            transform:translateY(-2px);
        }

        .cancel{

            display:block;

            width:100%;

            padding:13px;

            background:#6c757d;

            color:white;

            text-decoration:none;

            border-radius:10px;

            font-weight:bold;

            transition:0.3s;
        }

        .cancel:hover{

            background:#495057;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="icon">
        ⚠️
    </div>

    <h2>Delete Account</h2>

    <p>
        Are you sure you want to permanently delete your account?
    </p>

    <div class="warning">

        ⚠️ This action cannot be undone.
        Your account will be permanently removed
        from the database.

    </div>

    <form method="POST">

        {% csrf_token %}

        <button type="submit">

            🗑️ Permanently Delete My Account

        </button>

    </form>

    <a href="{% url 'dashboard' %}"
       class="cancel">

        ← Cancel and Return to Dashboard

    </a>

</div>

</body>

</html>
