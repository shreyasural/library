{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Add Book</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background-image:url("{% static 'images/addimage.avif' %}");
            background-size:cover;
            background-repeat:no-repeat;
            background-position:center;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .container{
            width:420px;
            background:rgba(255,255,255,0.92);
            padding:30px;
            border-radius:15px;
            box-shadow:0 8px 20px rgba(0,0,0,0.3);
        }

        h2{
            text-align:center;
            color:#0d6efd;
            margin-bottom:25px;
        }

        label{
            display:block;
            font-size:17px;
            font-weight:bold;
            color:#333;
            margin-bottom:6px;
        }

        input[type="text"]{
            width:100%;
            padding:10px;
            border:1px solid #ccc;
            border-radius:8px;
            margin-bottom:18px;
            font-size:16px;
        }

        input[type="submit"]{
            width:100%;
            padding:12px;
            background:#0d6efd;
            color:white;
            border:none;
            border-radius:8px;
            font-size:17px;
            cursor:pointer;
        }

        input[type="submit"]:hover{
            background:#084298;
        }

        .back-btn{
            display:block;
            text-align:center;
            margin-top:18px;
            text-decoration:none;
            background:#6c757d;
            color:white;
            padding:10px;
            border-radius:8px;
        }

        .back-btn:hover{
            background:#495057;
        }
    </style>

</head>

<body>

<div class="container">

    <h2>📚 Add New Book</h2>

    <form method="post">
        {% csrf_token %}

        <label>Book ID</label>
        <input type="text" name="book_id" placeholder="Enter Book ID" required>

        <label>Title</label>
        <input type="text" name="title" placeholder="Enter Book Title" required>

        <label>Author</label>
        <input type="text" name="author" placeholder="Enter Author Name" required>

        <label>Category</label>
        <input type="text" name="category" placeholder="Enter Book Category" required>

        <input type="submit" value="Add Book">
    </form>

    <a href="{% url 'dashboard' %}" class="back-btn">← Back to Dashboard</a>

</div>

</body>
</html>
